<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YToMP3 - YouTube to MP3 Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="w-full py-6 px-8 text-center border-b border-purple-900/40">
        <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-red-500 to-purple-400 bg-clip-text text-transparent">
            YToMP3
        </h1>
        <p class="text-sm text-slate-400 mt-1">Ubah video YouTube ke format MP3 dengan kualitas terbaik</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-slate-950/60 backdrop-blur-md border border-purple-900/50 p-8 rounded-2xl shadow-2xl w-full max-w-xl">
            <form id="convertForm" class="space-y-6">
                <!-- Input URL -->
                <div>
                    <label for="url" class="block text-sm font-medium text-slate-300 mb-2">Link YouTube</label>
                    <input type="text" id="url" name="url" required 
                        placeholder="https://www.youtube.com/watch?v=..." 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white placeholder-slate-500 text-sm transition">
                </div>

                <!-- Quality Selector -->
                <div>
                    <label for="quality" class="block text-sm font-medium text-slate-300 mb-2">Kualitas Audio (Bitrate)</label>
                    <select id="quality" name="quality" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-white text-sm transition">
                        <option value="320">320 kbps (Kualitas Tertinggi)</option>
                        <option value="256">256 kbps (Kualitas Tinggi)</option>
                        <option value="192">192 kbps (Standar Bagus)</option>
                        <option value="128" selected>128 kbps (Standar)</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 bg-gradient-to-r from-red-600 to-purple-600 hover:from-red-500 hover:to-purple-500 font-semibold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <span id="btnText">Konversi & Unduh MP3</span>
                </button>
            </form>

            <!-- Loading Status -->
            <div id="loading" class="hidden mt-6 text-center space-y-3">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent"></div>
                <p class="text-sm text-purple-300 animate-pulse">Sedang mengonversi audio, mohon tunggu sebentar...</p>
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="hidden mt-6 p-4 bg-red-950/60 border border-red-800 rounded-xl text-red-300 text-sm text-center"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-purple-900/40">
        &copy; 2026 YToMP3. All rights reserved.
    </footer>

    <!-- Script Frontend -->
    <script>
        const form = document.getElementById('convertForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value.trim();
            const quality = document.getElementById('quality').value;

            if (!url) return;

            // Reset UI
            errorMsg.classList.add('hidden');
            loading.classList.remove('hidden');
            submitBtn.disabled = true;
            btnText.textContent = 'Memproses...';

            try {
                const downloadUrl = `/convert?url=${encodeURIComponent(url)}&quality=${quality}`;
                
                // Trigger download via hidden iframe/anchor
                const a = document.createElement('a');
                a.href = downloadUrl;
                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => {
                    loading.classList.add('hidden');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Konversi & Unduh MP3';
                }, 3000);

            } catch (err) {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
                btnText.textContent = 'Konversi & Unduh MP3';
                errorMsg.textContent = 'Gagal memproses permintaan unduhan.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
